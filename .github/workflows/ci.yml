name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install gitleaks (checksum verified; tests shell out to it)
        run: |
          V=8.30.1
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v$V
          D=$RUNNER_TEMP/gitleaks-bin; mkdir -p $D; cd $D
          curl -sSfLO $BASE/gitleaks_${V}_linux_x64.tar.gz
          curl -sSfLO $BASE/gitleaks_${V}_checksums.txt
          grep "gitleaks_${V}_linux_x64.tar.gz" gitleaks_${V}_checksums.txt | sha256sum -c -
          tar xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
          echo $D >> $GITHUB_PATH
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:boundaries
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          V=8.30.1
          BASE=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfLO $BASE/gitleaks_${V}_linux_x64.tar.gz
          curl -sSfLO $BASE/gitleaks_${V}_checksums.txt
          grep "gitleaks_${V}_linux_x64.tar.gz" gitleaks_${V}_checksums.txt | sha256sum -c -
          tar xzf gitleaks_${V}_linux_x64.tar.gz gitleaks
      - run: ./gitleaks git --redact -v --config .gitleaks.toml
